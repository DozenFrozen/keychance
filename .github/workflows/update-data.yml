# Каждый час качает с WarcraftLogs столько, сколько позволяет лимит API, и сохраняет результат в репозиторий.
# Когда всё скачано, запуски почти ничего не делают, а раз в 7 дней рейтинги обновляются.
name: Update WCL data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wcl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch from WarcraftLogs
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        # порядок важности: сначала +10..+22, потом +2..+9, потом +23 и выше
        # и волнами по объёму: сначала по 25 забегов на всё, потом до 50, потом до 100
        run: python -u tools/wcl_fetch.py --levels "10-22,2-9,23-30" --runs "25,50,100" --region EU --no-wait --max-minutes 40

      # и после ошибки скачивания: кэш сохраняется в finally, скачанное не должно пропадать
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeyChance/Data.lua tools/wcl_cache.json
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Update WCL data"
            git pull --rebase
            git push
          fi
