# Каждый час качает с WarcraftLogs столько, сколько позволяет лимит API, и сохраняет результат в репозиторий.
# Когда всё скачано, запуски почти ничего не делают, а раз в 7 дней рейтинги обновляются.
name: Update WCL data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wcl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from WarcraftLogs
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python tools/wcl_fetch.py --min-level 10 --max-level 22 --runs 25 --region EU --no-wait

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeyChance/Data.lua tools/wcl_cache.json
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Update WCL data"
            git push
          fi
